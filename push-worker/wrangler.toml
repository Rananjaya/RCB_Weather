name = "rcb-weather-alerts"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Check every subscriber's weather every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "31bbc158c1a0483e90839bda641030ec"

[vars]
# Public half of the VAPID key pair (safe to publish). The private half is the secret
# VAPID_PRIVATE_JWK, set with: npx wrangler secret put VAPID_PRIVATE_JWK
VAPID_PUBLIC = "BAZG3q7Ru5jzaIrz1x1909hOXhlSw51ITSTixRoBv_CqNP_0lo27VzvHKQpZvuxZq04NCzErMwM9sOqil88560Y"
VAPID_SUBJECT = "https://github.com/Rananjaya/RCB_Weather"
ALLOWED_ORIGINS = "https://rananjaya.github.io,http://localhost:8080,http://localhost:8765"
