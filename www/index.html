<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RCB Weather</title>
  <meta name="description" content="RCB Weather — live weather from MET Norway, Open-Meteo or OpenWeatherMap." />
  <link rel="icon" href="icons/partly_day.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#100d1c" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RCB Weather" />
</head>
<body>
  <header class="top">
    <h1 class="brand"><img src="icons/partly_day.svg" alt="" /> RCB Weather</h1>
    <form id="search" class="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search a city or village…" aria-label="Search location" />
      <ul id="results" class="results" hidden></ul>
    </form>
    <button id="locate" class="btn" type="button" title="Use my current location">📍 My location</button>
  </header>

  <section class="controls">
    <label>Provider
      <select id="provider">
        <option value="metno">MET Norway</option>
        <option value="openmeteo">Open-Meteo</option>
        <option value="owm">OpenWeatherMap</option>
      </select>
    </label>
    <label id="keyWrap" hidden>API key
      <input id="owmKey" type="password" placeholder="Your OpenWeatherMap key" />
    </label>
    <label>Units
      <select id="units">
        <option value="c">°C</option>
        <option value="f">°F</option>
      </select>
    </label>
  </section>

  <main>
    <div class="live">
      <span id="clock" class="clock"></span>
      <span class="dot" aria-hidden="true"></span>
      <span id="updated"></span>
      <span id="status" class="status" role="status"></span>
    </div>

    <section id="now" class="card now" hidden>
      <div class="now-main">
        <img id="nowIcon" class="now-icon" alt="" />
        <div>
          <div id="place" class="place"></div>
          <div id="nowTemp" class="now-temp"></div>
          <div id="nowCond" class="now-cond"></div>
        </div>
      </div>
      <dl id="nowDetails" class="details"></dl>
    </section>

    <section id="airCard" class="card" hidden>
      <h2>Air quality</h2>
      <div class="air">
        <div id="aqiBadge" class="aqi"><span id="aqiValue"></span><small id="aqiLabel"></small></div>
        <dl id="airDetails" class="details"></dl>
      </div>
      <p id="airNote" class="note"></p>
    </section>

    <section id="hourlyCard" class="card" hidden>
      <h2>Next 24 hours</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section id="dailyCard" class="card" hidden>
      <h2>Next days</h2>
      <div id="daily" class="daily"></div>
    </section>

    <section id="imageryCard" class="card" hidden>
      <h2>Satellite &amp; radar</h2>
      <div id="imageryTabs" class="tabs" role="tablist"></div>
      <a id="imageryLink" target="_blank" rel="noopener"><img id="imagery" class="imagery" alt="" /></a>
      <p id="imageryNote" class="note"></p>
    </section>
  </main>

  <footer class="foot">
    <span id="attribution"></span>
    <span>Icons: RCB Wake original artwork.</span>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const hadSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    }
  </script>
</body>
</html>
